---
- name: Delete a volume using ibm.storage_virtualize
  hosts: all
  gather_facts: false
  collections:
    - ibm.storage_virtualize
  tasks:
    - name: Delete the volume
      ibm.storage_virtualize.ibm_svc_manage_volume:
        clustername: "{{ clustername }}"
        username: "{{ username }}"
        password: "{{ password }}"
        name: "{{ volume_name }}"
        state: "absent"
      register: delete_result

    - name: Print the result
      debug:
        var: delete_result
