- name: Export SSL certificate internally on primary
  ibm.storage_virtualize.ibm_sv_manage_ssl_certificate:
    clustername: "{{ clustername }}"
    username: "{{ username }}"
    password: "{{ password }}"
    log_path: "{{ log_path | default('/tmp/ansiblePB.log') }}"
    certificate_type: "system"

- name: Export SSL certificate internally on secondary
  ibm.storage_virtualize.ibm_sv_manage_ssl_certificate:
    clustername: "{{ hostvars['secondary_storage']['clustername'] }}"
    username: "{{ hostvars['secondary_storage']['username'] }}"
    password: "{{ hostvars['secondary_storage']['password'] }}"
    log_path: "{{ log_path | default('/tmp/ansiblePB.log') }}"
    certificate_type: "system"

- name: Create truststore on primary
  ibm.storage_virtualize.ibm_sv_manage_truststore_for_replication:
    clustername: "{{ clustername }}"
    username: "{{ username }}"
    password: "{{ password }}"
    log_path: "{{ log_path | default('/tmp/ansiblePB.log') }}"
    name: "{{ truststore_name }}"
    remote_clustername: "{{ hostvars['secondary_storage']['clustername'] }}"
    remote_username: "{{ hostvars['secondary_storage']['username'] }}"
    remote_password: "{{ hostvars['secondary_storage']['password'] }}"
    state: "present"
    restapi: "on"

- name: Create truststore on secondary
  ibm.storage_virtualize.ibm_sv_manage_truststore_for_replication:
    clustername: "{{ hostvars['secondary_storage']['clustername'] }}"
    username: "{{ hostvars['secondary_storage']['username'] }}"
    password: "{{ hostvars['secondary_storage']['password'] }}"
    log_path: "{{ log_path | default('/tmp/ansiblePB.log') }}"
    name: "{{ hostvars['secondary_storage']['truststore_name'] }}"
    remote_clustername: "{{ clustername }}"
    remote_username: "{{ username }}"
    remote_password: "{{ password }}"
    state: "present"
    restapi: "on"

- name: Initiate FC partnership from primary cluster
  ibm.storage_virtualize.ibm_sv_manage_fc_partnership:
    clustername: "{{ clustername }}"
    token: "{{ primary_auth.token }}"
    log_path: "{{ log_path | default('/tmp/ansiblePB.log') }}"
    remote_clustername: "{{ hostvars['secondary_storage']['clustername'] }}"
    remote_token: "{{ secondary_auth.token }}"
    remote_system: "{{ hostvars['secondary_storage']['system_name'] | default(hostvars['secondary_storage']['clustername']) }}"
    linkbandwidthmbits: 50
    backgroundcopyrate: 50
    start: 'True'
    state: present

- name: Complete FC partnership from secondary cluster
  ibm.storage_virtualize.ibm_sv_manage_fc_partnership:
    clustername: "{{ hostvars['secondary_storage']['clustername'] }}"
    token: "{{ secondary_auth.token }}"
    log_path: "{{ log_path | default('/tmp/ansiblePB.log') }}"
    remote_clustername: "{{ clustername }}"
    remote_token: "{{ primary_auth.token }}"
    remote_system: "{{ system_name | default(clustername) }}"
    linkbandwidthmbits: 50
    backgroundcopyrate: 50
    start: 'True'
    state: present

- name: Enable PBR on partnership on both sides
  ibm.storage_virtualize.ibm_sv_manage_fc_partnership:
    clustername: "{{ clustername }}"
    token: "{{ primary_auth.token }}"
    log_path: "{{ log_path | default('/tmp/ansiblePB.log') }}"
    remote_clustername: "{{ hostvars['secondary_storage']['clustername'] }}"
    remote_token: "{{ secondary_auth.token }}"
    remote_system: "{{ hostvars['secondary_storage']['system_name'] | default(hostvars['secondary_storage']['clustername']) }}"
    state: present
    pbrinuse: "yes"
